version: "3.9"
services:
  db:
    image: postgres:15-alpine
    container_name: pb5-db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appuser
    volumes:
      - pb5-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pb5-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgres://appuser:appuser@db:5432/appdb
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pb5-db-data: